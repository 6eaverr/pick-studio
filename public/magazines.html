<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>매거진 목록 · PICK Studio</title>
  <link rel="icon" href="/assets/pick-logo.jpg">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/css/studio.css">
</head>
<body class="loading">
  <aside class="sidebar" id="sidebar" aria-label="메뉴"></aside>
  <main>
    <section class="page-heading">
      <div>
        <div class="eyebrow">PICK MAGAZINE ARCHIVE</div>
        <h1 id="heading">매거진 <span>보관함</span></h1>
        <p id="subheading">모든 에디터가 만든 매거진을 둘러보세요. 표지를 누르면 상세 화면, 📖 를 누르면 펼쳐볼 수 있어요.</p>
      </div>
    </section>
    <section class="page">
      <form class="filters" id="filters" role="search">
        <label class="sr-only" for="q">제목·키워드 검색</label>
        <input class="search" id="q" type="search" placeholder="제목이나 키워드로 찾기" maxlength="100" autocomplete="off">
        <label class="sr-only" for="status">상태</label>
        <select id="status">
          <option value="">모든 상태</option>
          <option value="DRAFT">작성 중</option>
          <option value="REVIEW">검토 중</option>
          <option value="APPROVED">승인 완료</option>
          <option value="PUBLISHED">게시 완료</option>
        </select>
        <label class="sr-only" for="type">종류</label>
        <select id="type">
          <option value="">모든 종류</option>
          <option value="CURATION">큐레이션</option>
          <option value="ISSUE">이슈</option>
        </select>
        <label class="toggle"><input type="checkbox" id="mine"> 내 매거진만</label>
      </form>
      <p class="result-count" id="count" aria-live="polite"></p>
      <div class="magazine-grid" id="grid"></div>
      <button class="secondary load-more" id="more" hidden>더 보기</button>
    </section>
    <footer>PICK EDITORIAL STUDIO <span>YOUR DAILY DOSE OF MUSIC.</span></footer>
  </main>
  <script type="module" src="/js/magazines.js"></script>
</body>
</html>
