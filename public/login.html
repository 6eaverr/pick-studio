<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>로그인 · PICK Studio</title>
  <link rel="icon" href="/assets/pick-logo.jpg">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/css/studio.css">
</head>
<body class="auth-body">
  <main class="auth-card panel">
    <a class="brand" href="/login.html" aria-label="PICK Studio"><span class="ring"><img src="/assets/pick-logo.jpg" alt="PICK 로고"></span><span>pick<span class="brand-dot">.</span><small>EDITORIAL STUDIO</small></span></a>
    <h1>로그인</h1>
    <p class="lead">PICK 매거진 편집실에 오신 걸 환영해요.</p>
    <!-- 빈 칸으로 시작: 브라우저 자동 채우기를 막기 위해 처음엔 readonly, 칸을 누르면 입력 가능 (js/ui.js startEmpty) -->
    <form id="loginForm" novalidate autocomplete="off">
      <p class="form-error" id="formError" role="alert" hidden></p>
      <label class="field">이메일
        <input id="email" type="email" autocomplete="off" required maxlength="254" placeholder="you@example.com" readonly>
      </label>
      <label class="field">비밀번호
        <input id="password" type="password" autocomplete="off" required readonly>
      </label>
      <button class="primary" type="submit" id="submitBtn">로그인</button>
    </form>
    <p class="switch">처음이신가요? <a href="/signup.html" id="signupLink">회원가입</a></p>
  </main>
  <script type="module" src="/js/login.js"></script>
</body>
</html>
