<style>
  body{font:13px/1.5 system-ui,-apple-system,"Malgun Gothic",sans-serif;margin:0;padding:18px;color:#1d1d1d}
  h1{font-size:15px;margin:0 0 4px}
  p{margin:0 0 14px;color:#666}
  label{display:block;border:1.5px dashed #bbb;border-radius:10px;padding:22px 12px;text-align:center;cursor:pointer}
  label:hover{border-color:#ee553d;background:#fff6f4}
  input{display:none}
  #status{margin-top:12px;min-height:20px;color:#ee553d;font-weight:600}
</style>
<h1>PICK Studio → Figma</h1>
<p>PICK에서 저장한 <b>PICK-figma-….json</b> 파일을 선택하세요. 카드마다 1080×1350 프레임이 만들어지고 글자와 사진을 따로 편집할 수 있습니다.</p>
<label>JSON 파일 선택<input id="file" type="file" accept=".json,application/json"></label>
<div id="status"></div>
<script>
  const status=document.getElementById('status');
  document.getElementById('file').onchange=async e=>{
    const file=e.target.files[0];if(!file)return;
    status.textContent='파일을 읽는 중…';
    try{parent.postMessage({pluginMessage:{type:'import',data:await file.text()}},'*');status.textContent='Figma에 카드를 만드는 중…';}
    catch(err){status.textContent='파일을 읽지 못했습니다: '+err.message;}
  };
  onmessage=e=>{const m=e.data.pluginMessage;if(m&&m.type==='status')status.textContent=m.text;};
</script>
